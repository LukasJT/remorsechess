name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Test multiplayer in the Cloudflare runtime
        shell: bash
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > worker.log 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              node tests/smoke.mjs
              exit
            fi
            sleep 1
          done
          cat worker.log
          exit 1
