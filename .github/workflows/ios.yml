name: iOS build
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the Release app for the iOS simulator
        run: |
          xcodebuild -version
          plutil -lint ios/App/Info.plist ios/App/RemorseChess.entitlements ios/Resources/PrivacyInfo.xcprivacy
          xcodebuild -project ios/RemorseChess.xcodeproj -scheme RemorseChess -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check the release bundle
        run: |
          app="$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/RemorseChess.app"
          test -f "$app/Assets.car"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/RemorseEngine.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = com.remorsechess.ios
          sips -g pixelWidth -g pixelHeight -g hasAlpha ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Compile and archive for physical devices
        run: |
          xcodebuild -project ios/RemorseChess.xcodeproj -scheme RemorseChess -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/RemorseChess.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
